particle_filter:
  ros__parameters:
    # topic names
    scan_topic: '/scan'
    odometry_topic: '/odometry/filtered'
    # tf params
    map_frame: 'map'
    odom_frame: 'odom'
    laser_frame: 'ego_racecar/laser'
    publish_map_to_odom: true
    transform_tolerance: 0.5
    # boxed beam selection: beams evenly spaced along a corridor's walls, more of them looking down the track
    boxed_num_beams: 21
    boxed_aspect_ratio: 3.5
    # weight factor for particles in walls, unknown space or off the map
    use_map_penalty: false
    map_penalty: 0.01
    # localization score (/pf/localization_score, 0-100): % of beams within this range of the map's prediction
    inlier_threshold_m: 0.3
    max_particles: 2000
    squash_factor: 2.2
    # visualization
    viz: 0
    max_viz_particles: 500
    # ray marching method
    range_method: 'rmgpu'
    theta_discretization: 112.0
    # range data filtering
    max_range: 10.0
    fine_timing: 0
    publish_odom: 1
    # sensor model constants
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.75
    sigma_hit_m: 0.24          # was 8 px at 0.03 m/px
    lambda_short_per_m: 3.33   # was 0.1 / px at 0.03 m/px
    # TUM motion model
    alpha_1: 0.5
    alpha_2: 0.015
    alpha_3: 1.0
    alpha_4: 0.1
    lambda_thresh: 0.1
    noise_forward_bias: 0.5
    standstill_m: 0.005
    # sensor model variant, variant 2 good for rmgpu, 3 doesn't work for rmgpu
    rangelib_variant: 2
    # pose selection method, 'mean' or 'max'
    pose_selection_method: 'mean'

    ess_threshold: 0.5
    # global localization (no initial pose): searched with global_particles, shrinks to max_particles once converged
    global_particles: 80000
    global_squash_factor: 8.0
    global_converged_spread_m: 0.3
    global_converged_spread_rad: 0.2
    global_converged_scans: 5

    set_initial_pose: false

map_server:
  ros__parameters:
    # assuming map file is in particle_filter/maps
    map: 'vienne'

